; Firmware del prototipo Nervik — Raspberry Pi Pico W (RP2040, igual que el PDS)
; Compilar:  pio run          Subir:  pio run -t upload      Monitor:  pio device monitor
[platformio]
default_envs = pico_w_wifi

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m
monitor_speed = 115200
lib_deps =
    https://github.com/kmackay/micro-ecc.git
    https://github.com/bblanchon/ArduinoJson.git#v7.2.1
    https://github.com/ricmoo/QRCode.git
    https://github.com/autowp/arduino-mcp2515.git

; Prototipo de banco: Pico W y la red Wi-Fi (o el hotspot del celular) en lugar del módem
[env:pico_w_wifi]
board = rpipicow
build_flags = -DENLACE_WIFI

; Prototipo con el módem del BOM DFM-B: Pico + SIMCom SIM7080G (LTE-M/NB-IoT)
[env:pico_sim7080g]
board = pico
build_flags = -DENLACE_SIM7080G -DTINY_GSM_MODEM_SIM7080 -DTINY_GSM_RX_BUFFER=1024
lib_deps =
    ${env.lib_deps}
    https://github.com/vshymanskyy/TinyGSM.git#v0.12.0
    https://github.com/arduino-libraries/ArduinoHttpClient.git#0.6.1

; La misma Pico W de la Fase 1 con el módem SIM7080G (no hace falta comprar otra Pico)
[env:pico_w_sim7080g]
board = rpipicow
build_flags = ${env:pico_sim7080g.build_flags}
lib_deps = ${env:pico_sim7080g.lib_deps}
